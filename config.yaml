# ============================================================
# Synthetic Die-Level Feature Generation Configuration
# ============================================================

# Random seed for deterministic generation
seed: 42

# Dataset split
num_wafers_train: 160
num_wafers_test: 40

# WM-811K source file path (download from Kaggle)
wm811k_path: "data/LSWMD.pkl"

# Output directory for generated train/test data
output_dir: "input"

# Output formats: parquet, pkl, csv
output_formats:
  - csv

# ---------- Die-Level Feature Configuration ----------
# Number of parametric features per die
num_features: 500

# Feature naming: features will be named feature_1, feature_2, ..., feature_n
# Instead of listing each feature, we define distribution ranges for auto-generation.
# The script will deterministically generate num_features definitions using these ranges.
feature_generation:
  # Range for base_mean: features will have means uniformly sampled from this range
  base_mean_range: [0.1, 5000.0]
  # Range for base_std as a fraction of base_mean (coefficient of variation)
  cv_range: [0.02, 0.15]
  # Range for fail_shift as a fraction of base_std (controls overlap)
  # Small values = high overlap between pass and fail distributions
  fail_shift_fraction_range: [0.1, 0.5]
  # Use log-uniform sampling for base_mean (to cover wide range of scales)
  log_scale_mean: true

# ---------- Spatial Configuration ----------
# Neighborhood window size (odd number, e.g. 5 means 5x5 window around each die)
neighborhood_window: 5

# Zone grid: divide wafer into zone_rows x zone_cols blocks
zone_rows: 4
zone_cols: 4

# ---------- Spatial Gradient Parameters ----------
# Controls how much wafer position affects features (radial + linear gradients)
radial_gradient_strength: 0.3
linear_gradient_strength: 0.15

# Neighborhood influence: how much nearby fail density shifts features
neighborhood_influence: 0.2

# ---------- Class Imbalance ----------
# Target fail rate (will be approximately this, actual depends on WM-811K maps)
target_fail_rate: 0.03

# Rate at which currently-passing dies newly fail after the test
# This is the MEAN of an exponential distribution — actual per-wafer rate varies randomly
# Some wafers will have near-zero new fails, others will have many
new_fail_rate: 0.02

# Overlap control: fraction of failing dies that are "marginal" (nearly indistinguishable)
marginal_fail_fraction: 0.65

# ---------- Block-Level Readings Configuration ----------
# Number of block readings per die (sub-die test signal)
num_block_readings: 2000

# Block readings generation parameters
block_readings:
  # Base signal mean and std
  base_mean: 100.0
  base_std: 15.0
  # How much the signal shifts for failing dies (fraction of base_std)
  # Only a subset of blocks show the shift (sparse signal)
  fail_shift_fraction: 0.3
  # Fraction of blocks within a failing die that actually show anomalous readings
  # (most blocks look normal even in failing dies — sparse defect signature)
  anomalous_block_fraction: 0.05
  # Spatial correlation: nearby blocks within a die have correlated readings
  # (smoothing kernel size, 0 = no correlation)
  block_correlation_kernel: 5

